name: contract tests

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contracts/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near
      - name: Build and run the 109 contract tests
        run: cargo test
